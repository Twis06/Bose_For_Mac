<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"><rect width="1600" height="1000" fill="#dbe5dc"/><text x="104" y="164" font-family="Helvetica" font-size="66" font-weight="700" fill="#17352b">A little bar. One less number.</text><text x="108" y="252" font-family="Helvetica" font-size="30" font-weight="400" fill="#17352b">Battery at a glance, without crowding your menu bar.</text><text x="108" y="684" font-family="Helvetica" font-size="28" font-weight="400" fill="#17352b">Fills from the bottom as charge increases.</text><text x="108" y="734" font-family="Helvetica" font-size="28" font-weight="400" fill="#17352b">The exact percentage stays in the menu and tooltip.</text><text x="108" y="936" font-family="Helvetica" font-size="20" font-weight="400" fill="#17352b">Bose Bar  /  Optional vertical battery indicator</text><text x="1050" y="936" font-family="Helvetica" font-size="18" font-weight="400" fill="#17352b">Rendered demo · 100 / 60 / 15%</text></svg>